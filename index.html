<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>SkillbyAcademy – Discover Your Creative Potential</title>
<style>
:root{--bg:#000;--card:#0e0e0e;--tx:#fff;--mu:#a8a29c;--ac:#FCCDAC;--ac2:#f2a577;--or:#FCCDAC;--ln:#2b2b2b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-weight:600;letter-spacing:-.02em;line-height:1.2;margin:0 0 .6em}
nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 5%;border-bottom:1px solid var(--ln);flex-wrap:wrap}
nav b{font-size:18px}nav div{display:flex;gap:16px;flex-wrap:wrap}nav a{color:var(--mu);text-decoration:none;font-size:14px}nav a:hover{color:var(--tx)}
main{max-width:880px;margin:0 auto;padding:56px 5%}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1}}
.hero{text-align:center;padding:72px 0 88px}.hero h1{font-size:clamp(32px,6vw,54px)}
.hero p{color:var(--mu);max-width:640px;margin:0 auto 28px;font-size:18px}
.grad{color:var(--ac)}
.btn{display:inline-block;border:0;border-radius:10px;padding:12px 24px;font-family:inherit;font-weight:600;font-size:15px;color:#000;background:var(--ac);cursor:pointer;text-decoration:none;transition:opacity .2s}
.btn:hover{opacity:.85}.btn.o{background:none;color:var(--tx);border:1px solid var(--ln)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.card{background:none;border:1px solid var(--ln);border-radius:14px;padding:24px}
.card h3{font-size:22px}.card small{color:var(--or);font-weight:600}.card ul{color:var(--mu);padding-left:18px;margin:8px 0}
label{display:block;margin:12px 0;color:var(--mu);font-size:14px}
input,select,textarea{width:100%;margin-top:4px;padding:12px;border-radius:8px;border:1px solid var(--ln);background:#000;color:var(--tx);font:inherit}
.bar{height:3px;background:var(--ln);border-radius:9px;overflow:hidden;margin:6px 0 24px}.bar i{display:block;height:100%;background:var(--ac);transition:width .4s}
.opt{display:block;width:100%;text-align:left;margin:10px 0;padding:16px 18px;border-radius:10px;border:1px solid var(--ln);background:none;color:var(--tx);font:inherit;cursor:pointer;transition:.2s}
.opt:hover{border-color:var(--ac)}.opt b{color:var(--or);margin-right:8px}
.sec{color:var(--ac);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.m{margin:18px 0}.m div{display:flex;justify-content:space-between}.m .t{height:6px;background:var(--ln);border-radius:9px;overflow:hidden}.m .t i{display:block;height:100%;width:0;border-radius:9px;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.tag{display:inline-block;margin:4px 6px 4px 0;padding:4px 12px;border-radius:6px;background:#161616;font-size:13px}
.big{font-size:clamp(30px,6vw,52px)}.mu{color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px;border-bottom:1px solid var(--ln);text-align:left}
.tw{overflow-x:auto}.row{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.row>*{flex:1;min-width:140px}
.stat{font-weight:600;font-size:30px}.err{color:#f87171;font-size:14px}
@media print{nav,.noprint{display:none}body{background:#fff;color:#000}.card{border-color:#999;background:#fff}}
</style></head><body>
<nav><b class="grad">SkillbyAcademy</b><div><a href="#home">Home</a><a href="#about">About</a><a href="#course">Courses</a><a href="#contact">Contact</a><a href="#admin-login">Admin</a></div></nav>
<main id="app"></main>
<script>
const C={
pre:{n:"Pre-Production",id:"The Creative Thinker",c:"#FCCDAC",d:"The planning and creative development stage before filming begins.",f:["Storytelling and scriptwriting","Planning and organising","Storyboarding and shot planning","Understanding audience emotions"],s:["Script writing","Storyboarding","Research","Concept pitching"],r:["Creative Director","Scriptwriter","Storyboard Artist","Creative Producer","Content Strategist","Director","Advertising Creative"],w:"You naturally start with ideas, stories and plans before anything else."},
pro:{n:"Production",id:"The Visual Creator",c:"#E88F5A",d:"The actual filming and content creation stage.",f:["Photography and videography","Lighting and composition","Directing people and locations","Hands-on teamwork"],s:["Camera operation","Lighting","Composition","Directing on set"],r:["Photographer","Videographer","Cinematographer","Camera Assistant","Wedding Videographer","Commercial Video Creator"],w:"You focus on visuals, capturing real moments and learning by doing."},
post:{n:"Post-Production",id:"The Digital Storyteller",c:"#FFE9D9",d:"Where footage becomes a finished visual experience.",f:["Video editing and colour grading","Sound design","Motion graphics and VFX","Attention to detail"],s:["Editing software","Colour grading","Sound design","Motion graphics / AI tools"],r:["Video Editor","Colourist","Motion Graphics Artist","VFX Artist","Sound Designer","AI Video Creator","Social Media Editor"],w:"You love shaping raw material into a polished, emotional final result."}};
const K=["pre","pro","post"];
// Paste your Google Apps Script web-app URL here to save every submission to a Google Sheet (opens in Excel).
const SHEET_URL="https://script.google.com/macros/s/AKfycbwtkhV-vt3YG6rX-BhoIpIhbwZHQW6BI0su1Uvi97j9SXFZvKm7KpmnnQ67nYc5xdTd/exec";
const sync=r=>{if(SHEET_URL)try{fetch(SHEET_URL,{method:"POST",mode:"no-cors",body:JSON.stringify(Object.assign({id:"",name:"",age:"",email:"",phone:"",edu:"",city:"",exp:"",status:"",course:"",second:"",pre:"",pro:"",post:"",confidence:"",answers:"",time:""},r))}).catch(()=>{})}catch(e){}};
const SEC=["Imagination & Storytelling","Creative Problem Solving","Personality & Work Style","Imagination Challenges","Creative Decision Making"];
const Q=[
["Imagine you are given a completely empty room and asked to create a short film. What would you do first?","Think of a story and develop a script.","Explore camera angles and plan how to capture the room.","Imagine how to edit the footage and create the final atmosphere."],
["You see a person sitting alone at a railway station. What comes to your mind first?","What is their story? Why are they waiting?","How can I capture this moment beautifully?","How can I turn this moment into an emotional video?"],
["If you could create a 30-second advertisement, what would excite you most?","Developing the concept and writing the story.","Shooting the advertisement.","Editing it with music, effects and colour grading."],
["Your team has to shoot a commercial tomorrow, but there is no proper plan. What would you do?","Prepare the concept, script and storyboard.","Arrange the equipment and prepare the shoot.","Think about the editing style and final presentation."],
["You recorded a beautiful video, but the lighting is not perfect. What interests you most?","Think how the scene could have been planned better.","Experiment with lighting and camera techniques while shooting.","Correct the lighting and colours during editing."],
["Your client says the video is boring. What would you improve first?","The concept and storytelling.","The visuals and camera movements.","The editing, sound and transitions."],
["Which working environment attracts you most?","A creative planning room with scripts and ideas.","A filming location with cameras and equipment.","A digital editing studio with powerful computers."],
["Which activity can keep you engaged for hours?","Thinking, writing and developing creative ideas.","Capturing photos and videos.","Editing, designing and improving digital content."],
["In a team, which responsibility would you naturally choose?","Leading the concept and planning.","Managing the camera and filming.","Editing and completing the final output."],
["You have only a mobile phone and no budget for a 15-second ad. What would you focus on?","A unique concept and a powerful story.","Creative camera angles and practical shooting.","Editing techniques and visual effects."],
["You are making a travel film. Which part excites you most?","Planning the journey and developing the storyline.","Exploring places and capturing beautiful footage.","Creating a cinematic final travel film."],
["If you could master only one creative skill, which would you choose?","Creative direction and storytelling.","Cinematography and visual capture.","Video editing and visual effects."],
["You get a project with complete creative freedom. What do you do first?","Research, brainstorm and develop the concept.","Pick up a camera and start experimenting.","Open editing software and explore possibilities."],
["What would make you feel most satisfied after a project?","Seeing your original idea become a real project.","Seeing beautiful visuals that you captured.","Seeing raw footage become a professional final video."],
["Which statement describes you best?","I am imaginative and love ideas and planning.","I am practical and love creating and capturing things.","I am detail-oriented and enjoy transforming and improving things."]];
const $=s=>document.querySelector(s),app=$("#app");
let S={info:null,ans:[],i:0,id:null,res:null,admin:false};
const db={get(){try{return JSON.parse(localStorage.getItem("cp_students")||"[]")}catch(e){return []}},set(v){try{localStorage.setItem("cp_students",JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function score(a){const t=[0,0,0];a.forEach(x=>t[x]++);const n=a.length||1,p=t.map(v=>Math.round(v/n*100));const o=[0,1,2].sort((x,y)=>t[y]-t[x]);const d=p[o[0]]-p[o[1]];return{t,p,o,d,conf:d>=20?"High":d>=10?"Medium":"Low",tie:d<10}}
function courseCards(){return `<div class="grid">${K.map(k=>{const c=C[k];return `<div class="card"><small>${c.id}</small><h3>${c.n}</h3><p class="mu">${c.d}</p><b>Suited to people who enjoy</b><ul>${c.f.map(x=>`<li>${x}</li>`).join("")}</ul><b>Careers</b><p>${c.r.map(x=>`<span class="tag">${x}</span>`).join("")}</p></div>`}).join("")}</div>`}
const V={
home(){return `<section class="hero"><p class="sec">Discover Your Creative Potential</p><h1>Every Creative Mind Has a Direction. <span class="grad">Discover Yours.</span></h1><p>Answer a few creative challenges and discover which part of the media production world matches your imagination, personality, and skills.</p><a class="btn" href="#info">Discover My Creative Path</a></section><h2>Three paths. One creative you.</h2>${courseCards()}`},
about(){return `<h1>About the assessment</h1><div class="grid"><div class="card"><h3>15 scenarios</h3><p class="mu">Five sections of imagination, problem-solving, work-style and decision-making challenges. About 5 minutes. No experience needed.</p></div><div class="card"><h3>Transparent scoring</h3><p class="mu">Every answer adds a point to Pre-, Production or Post-Production. We show percentages, your top two matches and a confidence level.</p></div><div class="card"><h3>A guide, not a verdict</h3><p class="mu">This is not a scientific test and does not prove talent or guarantee career success. Use it as a starting point for a conversation with our counsellors.</p></div></div><p style="margin-top:28px"><a class="btn" href="#info">Start now</a></p>`},
info(){const i=S.info||{};return `<h1>Tell us about you</h1><p class="mu">Takes a minute. Previous experience is optional — beginners are welcome.</p><form id="f" class="card"><div class="grid"><label>Full name<input name="name" required value="${esc(i.name)}"></label><label>Age<input name="age" type="number" min="10" max="80" required value="${esc(i.age)}"></label><label>Email<input name="email" type="email" required value="${esc(i.email)}"></label><label>Phone<input name="phone" type="tel" required value="${esc(i.phone)}"></label><label>Education qualification<select name="edu" required>${["","High school","Higher secondary","Diploma","Bachelor’s degree","Master’s degree","Other"].map(o=>`<option ${i.edu==o?"selected":""}>${o}</option>`).join("")}</select></label><label>City<input name="city" required value="${esc(i.city)}"></label></div><label>Previous creative experience (optional)<textarea name="exp" rows="3">${esc(i.exp)}</textarea></label><label style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" name="consent" required style="width:auto;margin-top:5px"> I consent to the institute storing my details and assessment answers to contact me about courses.</label><button class="btn">Begin the assessment →</button></form>`},
quiz(){if(!S.info)return go("info");const n=S.i,q=Q[n];return `<p class="sec">Section ${Math.floor(n/3)+1} of 5 · ${SEC[Math.floor(n/3)]}</p><div class="bar"><i style="width:${n/15*100}%"></i></div><h2>${n+1}. ${q[0]}</h2>${[1,2,3].map(j=>`<button class="opt" data-a="${j-1}"><b>${"ABC"[j-1]}</b>${q[j]}</button>`).join("")}<button class="btn o" id="back" ${n?"":"hidden"}>← Back</button><span class="mu"> ${n+1} / 15</span>`},
result(){const r=S.res||score(S.ans);if(S.ans.length<15)return go("info");const [a,b]=r.o,A=C[K[a]],B=C[K[b]],mine=S.ans.filter(x=>x==a).length;
return `<p class="sec">Your creative identity</p><h1 class="big grad">${A.id}</h1><p style="font-size:20px">Your strongest match is <b>${A.n.toUpperCase()}</b>. <span class="mu">Confidence: ${r.conf} (${r.d}-point gap to second place).</span></p>
${r.tie?`<div class="card" style="margin:16px 0">Your scores for <b>${A.n}</b> and <b>${B.n}</b> are very close — both are potential strengths, and we recommend exploring both.</div>`:""}
<div class="grid"><div class="card"><h3>Your assessment scores</h3>${K.map((k,i)=>`<div class="m"><div><span>${C[k].n}</span><b>${r.p[i]}%</b></div><div class="t"><i data-w="${r.p[i]}" style="background:${C[k].c}"></i></div></div>`).join("")}</div>
<div class="card"><h3>Why this course suits you</h3><p class="mu">${A.w} You chose ${A.n} options in ${mine} of 15 scenarios, from "${S.ans[0]==a?"your first instinct in the empty room":"later challenges"}" through your work-style choices.</p><p><b>Secondary match:</b> ${B.n} (${r.p[b]}%)</p></div>
<div class="card"><h3>Creative strengths</h3><p>${A.f.map(x=>`<span class="tag">${x}</span>`).join("")}</p><h3>Skills to develop</h3><p>${A.s.map(x=>`<span class="tag">${x}</span>`).join("")}</p></div>
<div class="card"><h3>Possible careers</h3><p>${A.r.map(x=>`<span class="tag">${x}</span>`).join("")}</p></div></div>
<p class="mu" style="font-size:13px">This is a guide based on your answers, not a scientific measure of talent or a guarantee of career success.</p>
<div class="row noprint"><a class="btn" href="#course">Explore This Course</a><button class="btn o" onclick="print()">Download My Assessment Report</button></div>`},
course(){return `<h1>Our courses</h1>${courseCards()}<p style="margin-top:28px"><a class="btn" href="#contact">Apply / Enquire</a></p>`},
contact(){return `<h1>Contact &amp; admission</h1><form id="cf" class="card"><label>Name<input required></label><label>Email<input type="email" required></label><label>Course of interest<select>${K.map(k=>`<option>${C[k].n}</option>`).join("")}</select></label><label>Message<textarea rows="4"></textarea></label><button class="btn">Send enquiry</button><p id="cm" class="mu"></p></form>`},
"admin-login"(){return `<h1>Admin login</h1><form id="lf" class="card" style="max-width:420px"><label>Username<input name="u" required></label><label>Password<input name="p" type="password" required></label><p id="le" class="err"></p><button class="btn">Sign in</button><p class="mu" style="font-size:12px">Demo: admin / admin123</p></form>`},
admin(){if(!S.admin)return go("admin-login");const d=db.get(),dn=d.filter(x=>x.done),cnt=K.map((k,i)=>dn.filter(x=>x.top==i).length),mx=Math.max(1,...cnt);
const days=[...Array(7)].map((_,i)=>{const t=new Date(Date.now()-(6-i)*864e5).toDateString();return[t.slice(0,6),dn.filter(x=>new Date(x.ts).toDateString()==t).length]}),dm=Math.max(1,...days.map(x=>x[1]));
const ago=n=>dn.filter(x=>Date.now()-x.ts<n*864e5).length;
return `<h1>Admin dashboard</h1><div class="row"><div class="card"><div class="stat">${dn.length}</div>Submissions</div>${K.map((k,i)=>`<div class="card"><div class="stat" style="color:${C[k].c}">${cnt[i]}</div>${C[k].n}</div>`).join("")}<div class="card"><div class="stat">${d.length-dn.length}</div>Not completed</div></div>
<div class="grid"><div class="card"><h3>Course interest</h3>${K.map((k,i)=>`<div class="m"><div><span>${C[k].n}</span><b>${cnt[i]}</b></div><div class="t"><i data-w="${cnt[i]/mx*100}" style="background:${C[k].c}"></i></div></div>`).join("")}</div>
<div class="card"><h3>Submissions: last 7 days</h3><div style="display:flex;gap:6px;align-items:flex-end;height:120px">${days.map(x=>`<div style="flex:1;text-align:center;font-size:11px"><div style="height:${x[1]/dm*90}px;min-height:3px;background:var(--ac);border-radius:6px"></div>${x[1]}<br>${x[0].slice(4)}</div>`).join("")}</div><p class="mu">Today ${ago(1)} · Week ${ago(7)} · Month ${ago(30)}</p></div></div>
<div class="card" style="margin-top:18px"><div class="row"><input id="q" placeholder="Search name, email, city…"><select id="fc"><option value="">All courses</option>${K.map((k,i)=>`<option value="${i}">${C[k].n}</option>`).join("")}<option value="x">Not completed</option></select><button class="btn" id="ex">Export Excel</button><button class="btn o" id="lo">Log out</button></div><div class="tw"><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>City</th><th>Result</th><th></th></tr></thead><tbody id="tb"></tbody></table></div><div id="dt"></div></div>
<p class="mu" style="font-size:12px">Prototype note: data is stored in this browser only; production use needs a secure server database and real authentication.</p>`}};
function rows(){const q=($("#q").value||"").toLowerCase(),f=$("#fc").value;return db.get().filter(x=>(!f||(f=="x"?!x.done:x.done&&x.top==f))&&JSON.stringify(x.info).toLowerCase().includes(q))}
function drawRows(){$("#tb").innerHTML=rows().map(x=>`<tr><td>${esc(x.info.name)}</td><td>${esc(x.info.email)}</td><td>${esc(x.info.phone)}</td><td>${esc(x.info.city)}</td><td>${x.done?C[K[x.top]].n+" ("+x.pct.join("/")+"%)":"<span class='err'>Incomplete</span>"}</td><td><button class="btn o" style="padding:6px 14px" data-v="${x.id}">View</button></td></tr>`).join("")||"<tr><td colspan=6>No records</td></tr>"}
function go(h){location.hash=h;return ""}
function render(){const h=location.hash.slice(1)||"home",v=V[h]||V.home;const out=v();if(out===""&&!V[h])return;app.innerHTML=out;scrollTo(0,0);bind(h)}
function bind(h){
setTimeout(()=>document.querySelectorAll("[data-w]").forEach(e=>e.style.width=e.dataset.w+"%"),80);
if(h=="info")$("#f").onsubmit=e=>{e.preventDefault();S.info=Object.fromEntries(new FormData(e.target));delete S.info.consent;S.ans=[];S.i=0;S.res=null;S.id="s"+Date.now();const d=db.get();d.push({id:S.id,info:S.info,done:false,ts:Date.now()});db.set(d);sync({id:S.id,...S.info,status:"Started",time:new Date().toISOString()});go("quiz")};
if(h=="quiz"&&S.info){document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.ans[S.i]=+b.dataset.a;if(S.i<14){S.i++;render()}else{const r=score(S.ans);S.res=r;const d=db.get(),x=d.find(z=>z.id==S.id);if(x)Object.assign(x,{done:true,ans:S.ans,top:r.o[0],second:r.o[1],pct:r.p,conf:r.conf,ts:Date.now()});db.set(d);sync({id:S.id,...S.info,status:"Completed",course:C[K[r.o[0]]].n,second:C[K[r.o[1]]].n,pre:r.p[0],pro:r.p[1],post:r.p[2],confidence:r.conf,answers:S.ans.map(a=>"ABC"[a]).join(""),time:new Date().toISOString()});go("result")}});const b=$("#back");if(b)b.onclick=()=>{S.i--;render()}}
if(h=="contact")$("#cf").onsubmit=e=>{e.preventDefault();$("#cm").textContent="Thank you! Our admissions team will contact you shortly.";e.target.reset()};
if(h=="admin-login")$("#lf").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);if(f.get("u")=="admin"&&f.get("p")=="admin123"){S.admin=true;go("admin")}else $("#le").textContent="Invalid credentials."};
if(h=="admin"&&S.admin){drawRows();$("#q").oninput=$("#fc").onchange=drawRows;$("#lo").onclick=()=>{S.admin=false;go("home")};
$("#ex").onclick=()=>{const l=[["Name","Age","Email","Phone","Education","City","Course","Pre%","Pro%","Post%","Confidence"]];rows().forEach(x=>l.push([x.info.name,x.info.age,x.info.email,x.info.phone,x.info.edu,x.info.city,x.done?C[K[x.top]].n:"Incomplete",...(x.pct||["","",""]),x.conf||""]));const t=l.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n");try{const h="<table>"+l.map(r=>"<tr>"+r.map(c=>"<td>"+esc(c)+"</td>").join("")+"</tr>").join("")+"</table>";const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+h],{type:"application/vnd.ms-excel"}));a.download="skillbyacademy-students.xls";a.click()}catch(e){}$("#dt").innerHTML=`<p class="mu">If the download doesn’t start, copy this CSV (downloads are blocked in the hosted preview):</p><textarea rows="6" readonly onfocus="this.select()">${esc(t)}</textarea>`};
$("#tb").onclick=e=>{const id=e.target.dataset.v;if(!id)return;const x=db.get().find(z=>z.id==id);$("#dt").innerHTML=`<h3 style="margin-top:20px">${esc(x.info.name)} — answer history</h3><p class="mu">${esc(x.info.edu)} · age ${esc(x.info.age)} · experience: ${esc(x.info.exp)||"none"}</p>${x.done?`<p>${x.ans.map((a,i)=>`Q${i+1}:${"ABC"[a]}`).join(" · ")}</p><p>Top: <b>${C[K[x.top]].n}</b> · Second: ${C[K[x.second]].n} · Confidence: ${x.conf}</p>`:"<p class='err'>Assessment not completed.</p>"}`}}}
addEventListener("hashchange",render);render();
</script></body></html>
